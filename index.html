<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alex Huang Engraved Portfolio</title>
<meta name="description" content="Alex Huang, étudiant en troisième année à Epitech Paris, recherche un stage de mars à août 2027 en développement logiciel ou systèmes d'information.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300..700&display=swap">
<script>document.documentElement.classList.add('js');</script>
<style>
:root{
  /* Cobalt ink on paper. Every illustration is traced by a small raytracer and drawn as engraving lines.
     Layout: one column with generous whitespace, an availability banner that drops in after load. */
  --ink:#2a2ecd;
  --ink-soft:#e5e6fb;
  --paper:#fcfcfc;
  --text:#0b0b0c;
  --muted:#8f8f8f;
  --rule:#e3e3e3;
  --serif:"Instrument Serif","Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:clamp(16px,2vw,24px);
  --av:40px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--paper)}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:18px;line-height:1.35;font-weight:450;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
::selection{background:var(--ink);color:var(--paper)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit;text-align:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
canvas.eng{display:block;width:100%;background:var(--paper)}
canvas.eng.inv{background:var(--ink)}
.js canvas.eng{clip-path:inset(0 0 100% 0)}
.js canvas.eng.drawn{clip-path:inset(0 0 0 0);transition:clip-path 1.3s cubic-bezier(.3,.6,.2,1)}

.eyebrow{font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:450}
.h2{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:clamp(42px,5.8vw,86px);line-height:.92;letter-spacing:-.025em;text-transform:uppercase;text-wrap:balance}
.h2.sc{text-transform:none;font-size:clamp(34px,4.2vw,60px);line-height:1;letter-spacing:-.02em}
.rv{display:block;overflow:hidden;padding-bottom:.06em}
.rv>span{display:block}
.js .rv>span{transform:translateY(62%);opacity:.14;transition:transform 1.1s cubic-bezier(.2,.7,.2,1),opacity 1.1s ease}
.js .rv.in>span{transform:none;opacity:1}
.js .fade{color:#c2c2c2;transition:color 1.2s ease}
.js .fade.in{color:inherit}

/* Navigation */
.avail{position:fixed;top:0;left:0;right:0;z-index:21;height:var(--av);background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font-size:15px;text-decoration:none;padding:0 var(--gut);white-space:nowrap}
.avail .dot{width:8px;height:8px;border-radius:50%;background:#fff;flex:none}
.avail b{font-weight:600}
.avail .go{text-decoration:underline;text-underline-offset:3px;margin-left:8px}
section,footer{scroll-margin-top:110px}
.avail,.nav{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.js:not(.avail-in) .avail{transform:translateY(-100%);visibility:hidden}
.js:not(.avail-in) .nav{transform:translateY(calc(-1 * var(--av)))}
.nav{position:fixed;top:var(--av);left:0;right:0;z-index:20;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--gut);background:rgba(252,252,252,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{font-family:var(--serif);color:var(--ink);font-size:28px;letter-spacing:-.02em;text-decoration:none}
.nav-r{display:flex;gap:clamp(18px,3vw,40px);font-size:17px;text-transform:uppercase}
.nav-r button:hover{color:var(--ink)}

.menu{position:fixed;inset:0;z-index:30;background:var(--ink);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:var(--gut);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.menu.open{opacity:1;visibility:visible;transition:opacity .35s}
.menu nav{display:grid;gap:4px}
.menu a{font-family:var(--serif);font-size:clamp(48px,8.5vw,120px);line-height:.95;text-transform:uppercase;letter-spacing:-.03em;text-decoration:none;justify-self:start}
.menu a:hover,.menu a:focus-visible{font-style:italic}
.menu-close{position:absolute;top:22px;right:var(--gut);font-size:17px;text-transform:uppercase}

/* Hero */
.hero{height:calc(100vh - 118px);height:calc(100svh - 118px);min-height:470px;padding:126px var(--gut) 0;display:flex}
.hero-art{position:relative;flex:1;overflow:hidden}
.hero-art canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-text{position:absolute;left:0;right:0;top:41%;transform:translateY(-50%);display:grid;justify-items:center;gap:20px;text-align:center;padding:0 var(--gut);pointer-events:none}
.kicker{font-family:var(--serif);color:var(--ink);font-size:clamp(19px,1.7vw,25px);letter-spacing:-.02em;background:rgba(252,252,252,.85);padding:0 6px}
.hero h1{font-family:var(--serif);font-weight:400;color:var(--ink);text-transform:uppercase;font-size:clamp(48px,7.4vw,116px);line-height:.82;letter-spacing:-.045em;max-width:13ch;text-wrap:balance}
.hero h1 .w{display:inline-block;white-space:nowrap}
.js .hero h1 .ch{display:inline-block;animation:inkIn 1.3s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 24ms)}
@keyframes inkIn{from{opacity:0;color:#b9bbf2}to{opacity:1}}
.hero-act{pointer-events:auto;display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--ink);font-size:17px}
.hero-act a:not(.ticket){background:rgba(252,252,252,.88);padding:0 4px;text-underline-offset:4px}
.hero .ticket{background:var(--paper)}
.hero .ticket:hover{background:var(--ink-soft)}
.facts{padding:0 var(--gut)}
.facts dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.5fr);gap:22px}
.facts dl>div{border-top:1.5px solid var(--ink);padding-top:12px;display:grid;gap:4px;align-content:start}
.facts dt{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{font-size:16.5px;line-height:1.3;overflow-wrap:anywhere}
.facts dd span{display:block}

/* Manifesto */
.manifesto{padding:clamp(110px,16vh,190px) var(--gut) 0}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.m-art{justify-self:center;width:min(400px,82%)}
.m-text{display:grid;gap:20px;max-width:33ch}
.statement{font-size:clamp(30px,3.9vw,56px);line-height:1.08;letter-spacing:-.03em;font-weight:400;max-width:30ch;margin:clamp(120px,20vh,220px) 0 0}
.statement .wd{color:#cdcdcd;transition:color .35s}
.statement .wd.on{color:var(--text)}

.break{padding:0 var(--gut);margin-top:clamp(110px,18vh,200px)}
.break .b1{width:min(420px,92%)}
.break .b2{width:min(380px,84%);justify-self:end;margin-bottom:clamp(60px,14vh,160px)}

/* Sections */
.sec{padding:clamp(110px,17vh,200px) var(--gut) 0}
.sec-head{display:grid;gap:22px;margin-bottom:56px}
.sec-head p{max-width:40ch}

/* Project rows */
.rows{border-bottom:1px solid var(--rule)}
.row{position:relative;border-top:1px solid var(--rule)}
.row-line{position:absolute;left:0;top:-1px;height:1.5px;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.row:hover .row-line,.row.open .row-line{transform:scaleX(.44)}
.row h3{font:inherit}
.row-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) 40px;gap:28px;align-items:center;width:100%;padding:38px 0}
.r-title{display:block;font-family:var(--serif);text-transform:uppercase;font-size:clamp(32px,3.3vw,46px);line-height:.95;letter-spacing:-.02em;transition:color .3s}
.r-desc{display:block;margin-top:10px;max-width:50ch;font-size:17px;color:#2a2a2a}
.row:hover .r-title,.row.open .r-title{color:var(--ink)}
.tags{display:grid;gap:5px;justify-items:start}
.tag{display:flex;font-size:13.5px;line-height:1.15}
.tag b{background:var(--ink);color:#fff;font-weight:500;padding:4px 7px}
.tag i{font-style:normal;background:var(--ink-soft);color:var(--ink);padding:4px 8px}
.arrow{width:38px;height:38px;justify-self:end;transition:transform .45s cubic-bezier(.2,.7,.2,1),color .3s}
.row:hover .arrow{color:var(--ink)}
.row.open .arrow{transform:rotate(90deg);color:var(--ink)}
.row-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.2,.7,.2,1)}
.row.open .row-body{grid-template-rows:1fr}
.row-body>div{overflow:hidden}
.row-inner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:48px;padding:0 0 42px;align-items:start}
.r-left{display:grid;gap:22px}
.viz{border:1px solid var(--ink);padding:16px;display:grid;gap:12px;align-content:start;font-size:15px;min-width:0}
.viz-cap{color:var(--muted);font-size:13.5px}
.viz-btns{display:flex;gap:8px;flex-wrap:wrap}
.vb{border:1px solid var(--ink);color:var(--ink);padding:6px 12px;font-size:14px;text-decoration:none;background:none}
.vb:hover{background:var(--ink-soft)}
.vb:disabled{opacity:.45;cursor:default}
.vb.on{background:var(--ink);color:#fff}
.lz{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.lz li{border:1px solid var(--rule);padding:6px 10px;color:var(--muted)}
.lz li.done{border-color:var(--ink);color:var(--ink)}
.lz li.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.lz-msg{min-height:1.4em;color:var(--ink)}
.kits{display:grid;gap:8px;min-height:104px;align-content:start}
.kit{display:flex;align-items:center;gap:8px}
.kit i{width:16px;height:16px;border:1px solid var(--ink)}
.kit i.b{background:var(--ink)}
.kit span:last-child{color:var(--muted)}
.notes{list-style:none;display:grid;gap:12px;max-width:58ch}
.notes li{position:relative;padding-left:24px}
.notes li::before{content:"";position:absolute;left:0;top:.68em;width:12px;height:1px;background:var(--ink)}
.r-link{align-self:end;justify-self:start;color:var(--ink)}
.r-link a{display:inline-flex;gap:8px;align-items:center;text-decoration:underline;text-underline-offset:4px}
.r-link span{color:var(--muted)}
.r-link a{white-space:nowrap}
.r-link svg{width:18px;height:18px;flex:none}

/* Live path tracer */
.demo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:48px;align-items:end}
.demo-text{display:grid;gap:18px}
.demo-text .h2{margin-bottom:6px}
.demo-text small{font-size:14px;color:var(--muted);line-height:1.4}
.demo-text small a{color:var(--ink)}
.demo-view{position:relative;aspect-ratio:16/10;background:var(--ink-soft);border:1px solid var(--ink)}
.demo-view pt-viewer{position:absolute;inset:0;display:block;width:100%;height:100%;background:var(--ink-soft)}
.demo-view p{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--ink);font-size:15px}

/* Path */
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px}
.step{border-top:1px solid var(--rule);padding-top:30px;display:grid;gap:14px;align-content:start}
.step.hl{border-top:1.5px solid var(--ink)}
.step .n{font-family:var(--serif);color:var(--ink);font-size:clamp(52px,5vw,80px);line-height:.85;letter-spacing:-.03em}
.step .when{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.step h3{font-family:var(--serif);font-weight:400;text-transform:uppercase;font-size:25px;line-height:1;letter-spacing:-.01em}
.step p{font-size:16px}

/* Call to action */
.cta{position:relative;overflow:hidden;margin:clamp(120px,18vh,210px) var(--gut) 0;background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;min-height:clamp(440px,72vh,660px);padding:90px var(--gut)}
.cta canvas{position:absolute;width:clamp(150px,21vw,300px)}
.cta .c1{left:0;top:0}
.cta .c2{right:0;bottom:0}
.cta-in{position:relative;display:grid;justify-items:center;gap:20px}
.cta h2{color:#fff;max-width:15ch}
.cta p{color:#dcdcfb;max-width:42ch}
.ticket{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:15px 30px;font-size:17px;text-decoration:none;color:inherit;transition:background .25s}
.ticket svg.tk{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.cta .ticket:hover,.foot .ticket:hover{background:rgba(255,255,255,.1)}

/* About */
.about{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.arch{justify-self:center;width:min(390px,80%);border-radius:999px 999px 0 0;overflow:hidden}
.about-text{display:grid;gap:24px;max-width:48ch}
.skills{display:grid;grid-template-columns:auto 1fr;gap:7px 20px;font-size:16px}
.skills dt{color:var(--muted)}
.follow{display:grid;gap:8px}
.follow nav{display:flex;gap:24px;font-size:20px}
.follow a{text-decoration:none}
.follow a:hover{color:var(--ink)}

/* In production */
.quotes{border-bottom:1px solid var(--rule)}
.quote{border-top:1px solid var(--rule);padding:58px 0;display:grid;gap:12px}
.quote p{font-family:var(--serif);font-size:clamp(28px,2.9vw,42px);line-height:1.05;letter-spacing:-.02em;max-width:26ch}
.quote span{font-size:13px;letter-spacing:.08em;text-transform:uppercase}

/* FAQ */
.faq{border-bottom:1px solid var(--rule)}
.faq details{border-top:1px solid var(--rule)}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 0;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover,.faq details[open] summary{color:var(--ink)}
.plus{position:relative;width:18px;height:18px;flex:none;color:var(--ink);transition:transform .35s}
.plus::before,.plus::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.2px;background:currentColor}
.plus::after{transform:rotate(90deg)}
.faq details[open] .plus{transform:rotate(45deg)}
.faq .ans{padding:0 0 28px;max-width:64ch;color:#2a2a2a}

/* Footer */
.foot{margin-top:clamp(120px,18vh,210px);background:var(--ink);color:#fff}
.foot-body{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end;padding:clamp(40px,8vh,90px) var(--gut) 44px}
.foot h2{font-family:var(--serif);font-weight:400;font-size:clamp(42px,5.4vw,78px);line-height:1;letter-spacing:-.025em;margin-bottom:28px}
.foot-l{display:grid;gap:26px;justify-items:start}
.foot .mail{font-size:17px;text-underline-offset:4px}
.foot-r{display:grid;gap:14px;justify-items:end;text-align:right;font-size:15px;color:#dcdcfb}
.foot-r nav{display:flex;gap:18px;color:#fff}
.foot-r a{text-decoration:none}
.foot-r a:hover{text-decoration:underline}

/* Marquee */

@media (max-width:1120px) and (min-width:821px){
  .facts dl{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 22px}
  .facts dl>div:last-child{grid-column:span 2}
  .hero{height:calc(100svh - 176px)}
}
@media (max-width:820px){
  body{font-size:17px}
  .brand{font-size:24px}
  .hero{padding-top:112px;height:100svh;min-height:540px}
  .avail{font-size:12.5px;gap:8px;white-space:normal;text-align:center;line-height:1.15}
  .avail .dot{display:none}
  .avail .go{display:none}
  .facts{padding-top:22px}
  .facts dl{grid-template-columns:1fr 1fr;gap:18px 16px}
  .facts dl>div:last-child{grid-column:1/-1}
  .hero-text{top:36%}
  .hero h1{font-size:clamp(38px,11vw,64px)}
  .cta{padding-top:150px}
  .cta canvas{width:118px}
  .m-grid{grid-template-columns:1fr}
  .m-art{width:70%}
  .break canvas{aspect-ratio:1.5 !important}
  .row-head{grid-template-columns:minmax(0,1fr) 32px;gap:16px;padding:30px 0}
  .tags{grid-column:1/-1;grid-row:2}
  .arrow{width:30px;height:30px;grid-row:1;grid-column:2}
  .row-inner{grid-template-columns:1fr;gap:22px}
  .demo{grid-template-columns:1fr;gap:26px}
  .demo-view{aspect-ratio:4/3}
  .steps{grid-template-columns:1fr;gap:0}
  .step{padding:26px 0 30px}
  .about{grid-template-columns:1fr}
  .arch{width:72%}
  .foot-body{grid-template-columns:1fr}
  .foot-r{justify-items:start;text-align:left}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .avail,.nav{transition:none!important}
  .js canvas.eng{clip-path:none!important;transition:none!important}
}
</style>
</head>
<body>
<a class="avail" id="avail" href="#contact"><span class="dot" aria-hidden="true"></span><b id="availText"></b><span class="go" id="availGo"></span></a>
<header class="nav">
  <a class="brand" href="#top">alex huang</a>
  <div class="nav-r"><button id="langBtn" type="button">EN</button><button id="menuBtn" type="button" aria-expanded="false" aria-controls="menu">MENU</button></div>
</header>

<div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Menu">
  <button class="menu-close" id="menuClose" type="button">Fermer</button>
  <nav id="menuLinks"></nav>
</div>

<main>
  <section class="hero" id="top">
    <div class="hero-art">
      <canvas class="eng" data-scene="hero" aria-hidden="true"></canvas>
      <div class="hero-text">
        <p class="kicker" id="kicker"></p>
        <h1 id="h1"></h1>
        <div class="hero-act"><a class="ticket" id="heroBtn" href="#"></a><a href="https://www.linkedin.com/in/alex-huang-9a1704226" target="_blank" rel="noopener">LinkedIn</a><a href="https://github.com/Xelapte" target="_blank" rel="noopener">GitHub</a></div>
      </div>
    </div>
  </section>

  <section class="facts" id="enbref"><dl id="facts"></dl></section>

  <section class="manifesto" id="manifeste">
    <div class="m-grid">
      <div class="m-art"><canvas class="eng" data-scene="sphere" data-aspect="1" aria-hidden="true"></canvas></div>
      <div class="m-text" id="bio"></div>
    </div>
    <p class="statement" id="statement"></p>
  </section>

  <div class="break" aria-hidden="true">
    <canvas class="eng" data-scene="pano" data-aspect="3" data-aspect-m="1.7"></canvas>
  </div>

  <section class="sec" id="projets">
    <div class="sec-head"><p class="eyebrow" id="prEyebrow"></p><h2 class="h2 sc" id="prTitle"></h2></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="sec demo" id="demo">
    <div class="demo-text">
      <p class="eyebrow" id="dmEyebrow"></p>
      <h2 class="h2 sc" id="dmTitle"></h2>
      <p class="fade" id="dmText"></p>
      <small id="dmCredit"></small>
    </div>
    <div class="demo-view" id="demoView"><p id="dmWait"></p></div>
  </section>

  <section class="sec" id="parcours">
    <div class="sec-head"><p class="eyebrow" id="paEyebrow"></p><h2 class="h2" id="paTitle"></h2><p class="fade" id="paSub"></p></div>
    <div class="steps" id="steps"></div>
  </section>

  <section class="cta" aria-labelledby="ctaTitle">
    <canvas class="eng inv c1" data-scene="column" data-aspect="1" data-invert aria-hidden="true"></canvas>
    <canvas class="eng inv c2" data-scene="spheres" data-aspect="1" data-invert aria-hidden="true"></canvas>
    <div class="cta-in">
      <h2 class="h2" id="ctaTitle"></h2>
      <p id="ctaText"></p>
      <a class="ticket" id="ctaBtn" href="#contact"></a>
    </div>
  </section>

  <section class="sec about" id="apropos">
    <div class="arch"><canvas class="eng" data-scene="arch" data-aspect="0.75" aria-hidden="true"></canvas></div>
    <div class="about-text">
      <p class="eyebrow" id="abEyebrow"></p>
      <h2 class="h2" id="abTitle"></h2>
      <p class="fade" id="abText"></p>
      <dl class="skills" id="skills"></dl>
      <div class="follow"><p class="eyebrow" id="abFollow"></p><nav id="abLinks" aria-label="Profils"></nav></div>
    </div>
  </section>

  <section class="sec" id="production">
    <div class="sec-head"><p class="eyebrow" id="poEyebrow"></p><h2 class="h2" id="poTitle"></h2></div>
    <div class="quotes" id="quotes"></div>
  </section>

  <section class="sec" id="questions">
    <div class="sec-head"><p class="eyebrow" id="faEyebrow"></p><h2 class="h2" id="faTitle"></h2></div>
    <div class="faq" id="faq"></div>
  </section>
</main>

<footer class="foot" id="contact">

const INKC = '#2a2ecd', SOFT = '#e5e6fb';
function vCanvas(host, w, h) {

const VIZ = [
  /* Leducq: the pre-sale workflow and its one hard rule */
  (host, t) => {

    const ol = document.createElement('ol'); ol.className = 'lz'; host.appendChild(ol);
    const msg = vP(host, 'lz-msg'); msg.setAttribute('aria-live', 'polite');
    const bt = document.createElement('div'); bt.className = 'viz-btns'; host.appendChild(bt);
    const draw = () => { ol.innerHTML = t.l.steps.map((s, k) => '<li class="' + (k < st ? 'done' : k === st ? 'cur' : '') + '">' + esc(s) + '</li>').join(''); sign.textContent = signed ? t.l.signed : t.l.sign; sign.disabled = signed; next.disabled = st >= 3; };
    const next = vBtn(t.l.next, () => { if (st === 2 && !signed) { msg.textContent = t.l.blocked; return; } if (st < 3) { st++; msg.textContent = t.l.msgs[st]; } draw(); });
    const sign = vBtn(t.l.sign, () => { signed = true; msg.textContent = t.l.signedMsg; draw(); });
    bt.append(next, sign, vBtn(t.l.reset, () => { st = 0; signed = false; msg.textContent = ''; draw(); }));
    draw();
  },
  /* Verity: the pipeline, one step at a time */
  (host, t) => {
    vP(host, 'viz-cap', t.v.cap);
    const bt = document.createElement('div'); bt.className = 'viz-btns'; host.appendChild(bt);
    const d = vP(host, 'lz-msg'); d.setAttribute('aria-live', 'polite');
    const bs = t.v.steps.map((s, k) => vBtn((k + 1) + '. ' + s[0], () => pick(k)));
    const pick = (k) => { bs.forEach((b, j) => b.classList.toggle('on', j === k)); d.textContent = t.v.steps[k][1]; };
    bt.append(...bs); pick(0);
  },
  /* Raytracer: an engraved plate and a way to the live path tracer */
  (host, t) => {
    const cv = document.createElement('canvas'); cv.className = 'eng'; cv.dataset.scene = 'spheres'; cv.style.aspectRatio = '1.7'; host.appendChild(cv);
    const bt = document.createElement('div'); bt.className = 'viz-btns'; host.appendChild(bt);
    const a = document.createElement('a'); a.className = 'vb'; a.href = '#demo'; a.textContent = t.r.open; bt.appendChild(a);
    setTimeout(() => enqueue(cv), 650);
  },
  /* Zappy: eat, collect stones, call the team, level up */
  (host, t) => {
    vP(host, 'viz-cap', t.z.cap);
    const GW = 14, GH = 7, T = 40, [c, x] = vCanvas(host, GW * T, GH * T), st = vP(host, 'lz-msg');
    const rnd = (n) => Math.floor(Math.random() * n), drop = (arr, n) => { for (let k = 0; k < n; k++) arr.push([rnd(GW), rnd(GH)]); };
    const food = [], stones = []; let lvl = 1, call = null, flash = 0;
    drop(food, 10); drop(stones, 8);
    const ais = [0, 1, 2, 3].map(() => ({ x: rnd(GW), y: rnd(GH), f: 10 + rnd(6), s: 0 }));
    const near = (a, arr) => { let b = null, bd = 1e9; arr.forEach((p) => { const d = Math.abs(p[0] - a.x) + Math.abs(p[1] - a.y); if (d < bd) { bd = d; b = p; } }); return b; };
    const go = (a, p) => { if (a.x !== p[0]) a.x += Math.sign(p[0] - a.x); else if (a.y !== p[1]) a.y += Math.sign(p[1] - a.y); };

        if (target) go(a, target);
        let k = food.findIndex((p) => p[0] === a.x && p[1] === a.y);
        if (k >= 0 && a.f < 12) { food.splice(k, 1); a.f += 6; }
        if (!call) { k = stones.findIndex((p) => p[0] === a.x && p[1] === a.y); if (k >= 0) { stones.splice(k, 1); if (++a.s >= 3) call = a; } }
      });
      if (call && ais.filter((a) => a.x === call.x && a.y === call.y).length >= 3) { lvl = lvl >= 8 ? 1 : lvl + 1; call.s = 0; flash = 4; call = null; }
      if (food.length < 8) drop(food, 2); if (stones.length < 6) drop(stones, 2);

    const draw = () => {
      x.fillStyle = '#fcfcfc'; x.fillRect(0, 0, GW * T, GH * T);

      for (let k = 0; k <= GW; k++) { x.moveTo(k * T, 0); x.lineTo(k * T, GH * T); } for (let k = 0; k <= GH; k++) { x.moveTo(0, k * T); x.lineTo(GW * T, k * T); } x.stroke();

      x.strokeStyle = INKC; x.lineWidth = 1.3; stones.forEach((p) => { const cx = p[0] * T + 28, cy = p[1] * T + 28; x.beginPath(); x.moveTo(cx, cy - 5); x.lineTo(cx + 5, cy); x.lineTo(cx, cy + 5); x.lineTo(cx - 5, cy); x.closePath(); x.stroke(); });
      ais.forEach((a, k) => {
        const cx = a.x * T + 20 + (k % 2 ? 5 : -5), cy = a.y * T + 20 + (k > 1 ? 5 : -5);
        x.fillStyle = INKC; x.beginPath(); x.moveTo(cx, cy - 9); x.lineTo(cx + 8, cy + 7); x.lineTo(cx - 8, cy + 7); x.closePath(); x.fill();
        if (a === call || (flash && a.s === 0)) { x.beginPath(); x.arc(a.x * T + 20, a.y * T + 20, a === call ? 24 : 30, 0, 7); x.stroke(); }

    };
    c.addEventListener('click', (e) => { const [px, py] = vPos(c, e, GW * T); food.push([clamp(Math.floor(px / T), 0, GW - 1), clamp(Math.floor(py / T), 0, GH - 1)]); draw(); });
    draw(); const id = setInterval(tick, 420); return () => clearInterval(id);
  },
  /* CVRIE: k nearest neighbours on made-up points */
  (host, t) => {
    vP(host, 'viz-cap', t.k.cap);
    const W = 560, H = 290, [c, x] = vCanvas(host, W, H), out = vP(host, 'lz-msg');
    let seed = 7; const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const pts = [];
    for (let k = 0; k < 24; k++) { const a = r() * 6.283, d = Math.sqrt(r()) * 95; pts.push([190 + Math.cos(a) * d, 165 + Math.sin(a) * d * 0.8, 1]); }
    for (let k = 0; k < 24; k++) { const a = r() * 6.283, d = Math.sqrt(r()) * 95; pts.push([375 + Math.cos(a) * d, 125 + Math.sin(a) * d * 0.8, 0]); }
    let q = [285, 150];
    const draw = () => {
      x.fillStyle = '#fcfcfc'; x.fillRect(0, 0, W, H);
      const nn = pts.map((p) => [Math.hypot(p[0] - q[0], p[1] - q[1]), p]).sort((a, b) => a[0] - b[0]).slice(0, 5);
      x.strokeStyle = INKC; x.lineWidth = 1; nn.forEach((n) => { x.beginPath(); x.moveTo(q[0], q[1]); x.lineTo(n[1][0], n[1][1]); x.stroke(); });

      pts.forEach((p) => { x.beginPath(); x.arc(p[0], p[1], 5, 0, 7); if (p[2]) { x.fillStyle = INKC; x.fill(); } else { x.fillStyle = '#fcfcfc'; x.fill(); x.lineWidth = 1.4; x.stroke(); } });
      const a = nn.filter((n) => n[1][2]).length;

    c.addEventListener('click', (e) => { q = vPos(c, e, W); draw(); });
    draw();
  },
  /* Arcade: a playable Snake */
  (host, t) => {
    vP(host, 'viz-cap', t.a.cap);

    const reset = () => { snake = [[8, 7], [7, 7], [6, 7]]; dir = nextDir = [1, 0]; score = 0; place(); };

    };
    const tick = () => {
      dir = nextDir; const h = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
      if (h[0] < 0 || h[1] < 0 || h[0] >= CW || h[1] >= CH || snake.some((p) => p[0] === h[0] && p[1] === h[1])) { state = 'over'; clearInterval(id); draw(); return; }

    c.addEventListener('click', start);
    c.addEventListener('keydown', (e) => { const k = KEYS[e.key]; if (k) { e.preventDefault(); turn(k[0], k[1]); } else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); start(); } });
    const bt = document.createElement('div'); bt.className = 'viz-btns'; host.appendChild(bt);
    [['←', -1, 0], ['↑', 0, -1], ['↓', 0, 1], ['→', 1, 0]].forEach((b) => bt.appendChild(vBtn(b[0], () => turn(b[1], b[2]))));
    reset(); draw(); return () => clearInterval(id);
  },
  /* The Plazza: kitchens as processes */
  (host, t) => {
    vP(host, 'viz-cap', t.p.cap);
    const bt = document.createElement('div'); bt.className = 'viz-btns'; host.appendChild(bt);
    const list = document.createElement('div'); list.className = 'kits'; host.appendChild(list);
    const out = vP(host, 'lz-msg');

    const draw = () => {
      list.innerHTML = kitchens.length ? kitchens.map((k) => '<div class="kit"><span>' + esc(t.p.kitchen) + ' ' + k.id + '</span>' + k.cooks.map((c) => '<i class="' + (c > 0 ? 'b' : '') + '"></i>').join('') + '<span>' + k.queue + ' ' + esc(t.p.queue) + '</span></div>').join('') : '<p class="viz-cap">' + esc(t.p.none) + '</p>';

      for (let p = 0; p < 3; p++) {

        if (!k) { if (kitchens.length >= 4) k = kitchens.slice().sort((a, b) => load(a) - load(b))[0]; else { k = { id: ++n, cooks: new Array(COOKS).fill(0), queue: 0, idle: 0 }; kitchens.push(k); } }

      kitchens.forEach((k) => {
        k.cooks = k.cooks.map((c) => { if (c > 0) { c--; if (c === 0) served++; } if (c === 0 && k.queue > 0) { k.queue--; c = 5; } return c; });
        k.idle = load(k) ? 0 : k.idle + 1;

let vizStops = [];
function initViz(row) {
  const host = row.querySelector('.viz'); if (!host || host.dataset.on) return;
  host.dataset.on = '1';
  const stop = VIZ[+host.dataset.viz](host, VZ[lang]); if (stop) vizStops.push(stop);
}

/* ======================= Interactions ======================= */
function bind() {
  $('#langBtn').addEventListener('click', () => { lang = lang === 'fr' ? 'en' : 'fr'; try { localStorage.setItem('lang', lang); } catch (e) { /* storage unavailable */ } render(); });
  const menu = $('#menu');
  const setMenu = (open) => {
    menu.classList.toggle('open', open); $('#menuBtn').setAttribute('aria-expanded', String(open));
    document.documentElement.style.overflow = open ? 'hidden' : '';
    if (open) $('#menuClose').focus(); else $('#menuBtn').focus({ preventScroll: true });
  };
  $('#menuBtn').addEventListener('click', () => setMenu(true));
  $('#menuClose').addEventListener('click', () => setMenu(false));
  menu.addEventListener('click', (e) => { if (e.target.closest('a')) setMenu(false); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && menu.classList.contains('open')) setMenu(false); });
  $('#rows').addEventListener('click', (e) => {
    const b = e.target.closest('.row-head'); if (!b) return;
    const row = b.closest('.row'), open = !row.classList.contains('open');
    row.classList.toggle('open', open); b.setAttribute('aria-expanded', String(open));
    if (open) initViz(row);
  });
  let ticking = false;
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { updateStatement(); ticking = false; }); } }, { passive: true });
}

bind();
render();
setupPlates();
setupDemo();
const dropBanner = () => setTimeout(() => document.documentElement.classList.add('avail-in'), reduce ? 0 : 2000);
if (document.readyState === 'complete') dropBanner(); else addEventListener('load', dropBanner, { once: true });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(tickets);
})();
